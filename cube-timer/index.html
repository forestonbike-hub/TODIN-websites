<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cube Timer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hand shape for the Stack Mat pads: a left hand, palm down, thumb on the right.
       The right pad mirrors it so both thumbs point inward. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="hand" viewBox="0 0 104 120">
      <rect x="14" y="50" width="56" height="58" rx="20"/>
      <rect x="14" y="36" width="12" height="36" rx="6"/>
      <rect x="28" y="20" width="13" height="48" rx="6.5"/>
      <rect x="43" y="12" width="13" height="56" rx="6.5"/>
      <rect x="58" y="20" width="12" height="48" rx="6"/>
      <circle cx="64" cy="88" r="11"/>
      <rect x="66" y="58" width="13" height="36" rx="6.5" transform="rotate(35 72.5 94)"/>
    </symbol>
  </svg>

  <!-- NORMAL VIEW -->
  <div id="app">

    <!-- LEFT SIDE (top in portrait): charts + settings -->
    <div id="side">

      <!-- Puzzle folders: each keeps its own solves, charts, stats and settings -->
      <div id="folder-row"></div>

      <div id="top-row">
        <div id="chart-wrap" class="chart-card">
          <div id="progress-title" class="chart-title">Progress</div>
          <canvas id="progress-chart"></canvas>
          <div id="chart-hint" class="chart-hint">No solves yet</div>
        </div>
        <div id="best-bar">
          <span id="best-label">Best Time</span>
          <span id="best-time">--:--.--</span>
          <span id="avg-label">Average</span>
          <span id="avg-time">--:--.--</span>
        </div>
      </div>

      <div id="stage-chart-wrap" class="chart-card hidden">
        <div class="chart-head">
          <span class="chart-title">Stage Progress</span>
          <span id="stage-legend"></span>
        </div>
        <canvas id="stage-chart"></canvas>
        <div id="stage-chart-hint" class="chart-hint">Finish 2 stage solves to see this chart</div>
      </div>

      <div id="settings">
        <div class="setting-line">
          <label class="toggle-row">
            <span class="setting-label">Stage Practice</span>
            <span class="switch"><input type="checkbox" id="stage-toggle"><span class="slider"></span></span>
          </label>
          <label id="stage-options" class="num-field">
            Stages <input type="number" id="stage-count" inputmode="numeric" min="1" max="10">
          </label>
        </div>

        <div id="stage-sub" class="setting-line sub">
          <label class="toggle-row">
            <span class="setting-label">Beeps</span>
            <span class="switch"><input type="checkbox" id="beep-toggle"><span class="slider"></span></span>
          </label>
        </div>

        <div class="setting-line">
          <label class="toggle-row">
            <span class="setting-label">Inspection Time</span>
            <span class="switch"><input type="checkbox" id="insp-toggle"><span class="slider"></span></span>
          </label>
        </div>

        <div id="insp-options" class="setting-line sub">
          <label class="toggle-row">
            <span class="setting-label">Voice Callouts</span>
            <span class="switch"><input type="checkbox" id="voice-toggle"><span class="slider"></span></span>
          </label>
          <span id="voice-options" class="voice-fields">
            <label class="num-field">1st call <input type="number" id="voice1" inputmode="numeric" min="1" max="60"> sec</label>
            <label class="num-field">2nd call <input type="number" id="voice2" inputmode="numeric" min="1" max="60"> sec</label>
          </span>
        </div>

        <div class="setting-line">
          <label class="toggle-row">
            <span class="setting-label">Stack Mat</span>
            <span class="switch"><input type="checkbox" id="stack-toggle"><span class="slider"></span></span>
          </label>
        </div>
      </div>

    </div>

    <!-- RIGHT SIDE (bottom in portrait): timer + solves -->
    <div id="main">

      <div id="timer-display">
        <span id="timer-text">0:00.00</span>
        <div id="status-note"></div>
        <div id="penalty-btns" class="hidden">
          <button id="plus2-btn" class="penalty-btn plus2">Add 2 seconds</button>
          <button id="plus02-btn" class="penalty-btn plus02">Add 0.2 seconds</button>
          <button id="dnf-btn" class="penalty-btn dnf">DNF</button>
        </div>
        <div id="hint">Hold to start</div>
        <button id="start-insp-btn" class="hidden">Start Inspection</button>
        <div id="main-pad-area" class="hidden">
          <div id="main-pad-hint" class="pad-hint"></div>
          <div id="main-pads" class="pads">
            <div class="pad left"><svg class="hand"><use href="#hand"/></svg></div>
            <div class="pad right"><svg class="hand"><use href="#hand"/></svg></div>
          </div>
        </div>
      </div>

      <div id="solves-section">
        <div id="solves-header">
          <span id="solves-title">Solves</span>
          <button id="clear-btn">Clear All</button>
        </div>
        <div id="solves-list"></div>
      </div>

    </div>

  </div>

  <!-- HOLDING OVERLAY (green) -->
  <div id="hold-overlay" class="hidden">
    <div id="hold-text">Keep holding...</div>
  </div>

  <!-- INSPECTION OVERLAY (counts up seconds) -->
  <div id="insp-overlay" class="hidden">
    <div class="overlay-center">
      <div id="insp-label">Inspection</div>
      <div id="insp-timer">0</div>
      <div id="insp-warn"></div>
      <button id="start-solve-btn">Start Solve Timer</button>
      <div id="insp-pad-hint" class="pad-hint hidden"></div>
    </div>
    <div id="insp-pads" class="pads side-pads hidden">
      <div class="pad left"><svg class="hand"><use href="#hand"/></svg></div>
      <div class="pad right"><svg class="hand"><use href="#hand"/></svg></div>
    </div>
  </div>

  <!-- RUNNING OVERLAY (fullscreen timer) -->
  <div id="run-overlay" class="hidden">
    <div class="overlay-center">
      <div id="run-timer">0:00.00</div>
      <div id="run-splits"></div>
      <div id="run-hint">Tap anywhere to stop</div>
    </div>
    <div id="run-pads" class="pads side-pads hidden">
      <div class="pad left"><svg class="hand"><use href="#hand"/></svg></div>
      <div class="pad right"><svg class="hand"><use href="#hand"/></svg></div>
    </div>
  </div>

  <!-- CONFIRM POP-UP -->
  <div id="modal" class="hidden">
    <div class="modal-card">
      <div id="modal-title"></div>
      <div id="modal-text"></div>
      <div class="modal-btns">
        <button id="modal-no"></button>
        <button id="modal-yes"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
